# Builds an UNSIGNED mreader.ipa for sideloading with SideStore, which
# re-signs it on the iPad with a free Apple ID. No signing secrets are needed.
name: iOS IPA (unsigned, for SideStore)

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: write # only used to attach the IPA to a GitHub Release on tag pushes

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web assets (ios mode)
        id: web
        run: |
          set -o pipefail
          yarn build:ios | tee web-build.log
          build=$(sed -n 's/^mreader build \([0-9]\{14\}\)$/\1/p' web-build.log | tail -1)
          test -n "$build" || { echo "Build number not found in vite output" >&2; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Sync Capacitor iOS project
        run: |
          # The ios/ project is normally committed; generate it if it is not yet.
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Build unsigned app
        env:
          BUILD_NUMBER: ${{ steps.web.outputs.build }}
        run: |
          # Capacitor uses a workspace with CocoaPods and a plain project with SwiftPM.
          if [ -d ios/App/App.xcworkspace ]; then
            container=(-workspace ios/App/App.xcworkspace)
          else
            container=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${container[@]}" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: ipa
        env:
          BUILD_NUMBER: ${{ steps.web.outputs.build }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          name="mreader-$BUILD_NUMBER.ipa"
          zip -qry "$name" Payload
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "mreader build $BUILD_NUMBER -> $name" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.name }}
          retention-days: 14

      # A Release asset has a stable URL that Safari on the iPad can download
      # without a GitHub login, unlike workflow artifacts.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.ipa.outputs.name }}" --title "$GITHUB_REF_NAME" --notes "mreader build ${{ steps.web.outputs.build }}"
